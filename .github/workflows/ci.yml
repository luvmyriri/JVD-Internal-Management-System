name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env: { POSTGRES_DB: jvd_test, POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres }
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.4', extensions: 'pdo_pgsql, redis, gd', coverage: none }
      - run: composer install --no-interaction --prefer-dist
        working-directory: backend
      - run: cp .env.example .env && php artisan key:generate
        working-directory: backend
      - run: php artisan migrate --force && php artisan test
        working-directory: backend
        env: { DB_CONNECTION: pgsql, DB_HOST: 127.0.0.1, DB_DATABASE: jvd_test, DB_USERNAME: postgres, DB_PASSWORD: postgres, CACHE_STORE: array, SESSION_DRIVER: array, QUEUE_CONNECTION: sync }
      - run: composer audit --locked
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend
