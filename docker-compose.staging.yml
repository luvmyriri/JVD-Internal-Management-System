services:
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on: [app]
    volumes:
      - ./backend:/var/www/html:ro
      - ./backend/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["8080:80"]
  app:
    build: { context: ./backend, dockerfile: Dockerfile }
    restart: unless-stopped
    env_file: [./backend/.env.staging]
    depends_on: [postgres, redis]
  worker:
    build: { context: ./backend, dockerfile: Dockerfile }
    restart: unless-stopped
    env_file: [./backend/.env.staging]
    depends_on: [postgres, redis]
    command: php artisan queue:work redis --tries=3 --timeout=90 --sleep=3
  mail-worker:
    build: { context: ./backend, dockerfile: Dockerfile }
    restart: unless-stopped
    env_file: [./backend/.env.staging]
    depends_on: [postgres, redis]
    command: php artisan queue:work redis --queue=mail --tries=3 --timeout=180 --sleep=1
  scheduler:
    build: { context: ./backend, dockerfile: Dockerfile }
    restart: unless-stopped
    env_file: [./backend/.env.staging]
    depends_on: [postgres, redis]
    command: php artisan schedule:work
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    env_file: [./backend/.env.staging]
    environment: { POSTGRES_DB: "${DB_DATABASE}", POSTGRES_USER: "${DB_USERNAME}", POSTGRES_PASSWORD: "${DB_PASSWORD}" }
    volumes: [jvd_pgdata_staging:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes: [jvd_redisdata_staging:/data]
volumes:
  jvd_pgdata_staging:
  jvd_redisdata_staging:
