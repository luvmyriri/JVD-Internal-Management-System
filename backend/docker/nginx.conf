# Production Nginx config
# - Static React SPA served at /  (root = /var/www/frontend)
# - Laravel API routed at /api, /sanctum, /storage, /uploads (PHP-FPM)
server {
    listen 80;
    server_name _;

    client_max_body_size 25m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # React SPA root
    root /var/www/frontend;
    index index.html;

    # Laravel API, Auth, CSRF, and storage routes
    location ~ ^/(auth|api|sanctum|storage|uploads)(/|$) {
        root /var/www/html/public;
        try_files $uri $uri/ /index.php?$query_string;

        location ~ \.php$ {
            fastcgi_pass app:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
            include fastcgi_params;
            fastcgi_read_timeout 120;
        }
    }

    # Direct PHP file handling if called within public
    location ~ \.php$ {
        root /var/www/html/public;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 120;
    }

    # WebSocket proxying for Chat
    location /ws {
        proxy_pass http://ws:6001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }

    # React SPA — all other routes (client-side routing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    location ~* \.(?:env|log|sql)$ {
        deny all;
    }
}
