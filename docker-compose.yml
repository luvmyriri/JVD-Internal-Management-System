version: '3.8'

services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jvd_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=jvd_erp
      - DB_USERNAME=postgres
      - DB_PASSWORD=password
      - REDIS_HOST=redis
      - QUEUE_CONNECTION=redis
    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"
    command: php artisan serve --host=0.0.0.0 --port=8000

  postgres:
    image: postgres:15-alpine
    container_name: jvd_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: jvd_erp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - jvd_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: jvd_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - jvd_redisdata:/data

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jvd_worker
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=jvd_erp
      - DB_USERNAME=postgres
      - DB_PASSWORD=password
      - REDIS_HOST=redis
      - QUEUE_CONNECTION=redis
    depends_on:
      - postgres
      - redis
    command: php artisan queue:work redis --queue=mail,default --tries=3 --timeout=180 --sleep=1

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: jvd_frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000

volumes:
  jvd_pgdata:
  jvd_redisdata:
